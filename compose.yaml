services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: runstate
      POSTGRES_PASSWORD: runstate
      POSTGRES_DB: runstate_dev
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runstate -d runstate_dev"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - runstate_postgres:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro

volumes:
  runstate_postgres:
